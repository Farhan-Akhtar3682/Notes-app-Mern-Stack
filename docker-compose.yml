
services:
  frontend:
    image: 693906847517.dkr.ecr.ap-southeast-2.amazonaws.com/frontend:latest
    ports:
      - "80:5173"
    depends_on:
      - backend

  backend:
    container_name: backend
    image: 693906847517.dkr.ecr.ap-southeast-2.amazonaws.com/backend:latest
    env_file:
      - ./server/env
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mypassword
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
