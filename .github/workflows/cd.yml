
name: Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ec2-ssh
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$SSH_KEY" > mern.pem
          chmod 600 mern.pem

          mkdir -p ~/.ssh
          ssh-keyscan -H ec2-3-25-242-52.ap-southeast-2.compute.amazonaws.com >> ~/.ssh/known_hosts

          ssh -i mern.pem \
            ubuntu@ec2-3-25-242-52.ap-southeast-2.compute.amazonaws.com \
            "aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin 693906847517.dkr.ecr.ap-southeast-2.amazonaws.com && cd ~/Notes-app-Mern-Stack && docker compose pull && docker compose up -d"
