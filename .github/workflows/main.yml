name: notes-app-ci/cd
on:
 push:
  branches:
    - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
       - name: checkout
         uses: actions/checkout@v4
       - name: aws configure
         uses: aws-actions/configure-aws-credentials@v6.3.0
         with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.region }}   
       - name: Login to ECR
         uses: aws-actions/amazon-ecr-login@v2
       - name: Docker Build
         run: |
          docker build -t backend ./server/
          docker tag backend:latest 693906847517.dkr.ecr.ap-southeast-2.amazonaws.com/backend:latest
          docker push 693906847517.dkr.ecr.ap-southeast-2.amazonaws.com/backend:latest
          docker build -t frontend ./client/
          docker tag frontend:latest 693906847517.dkr.ecr.ap-southeast-2.amazonaws.com/frontend:latest
          docker push 693906847517.dkr.ecr.ap-southeast-2.amazonaws.com/frontend:latest
          
      
  
  
    
 
